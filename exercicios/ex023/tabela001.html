<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<style>

    * {
        font-family: Arial, Helvetica, sans-serif;
    }

    main {
        
        margin: auto;
    }

    h1 {
        text-align: center;
        font-size: 3em;
    }

    table {
        text-align: center;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
    }


</style>

<body>
    <main>
        <h1>Controle de Estoque</h1>
        <table>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>

            <tr>
                <td>Notebook</td>
                <td>12</td>
                <td>R$ 3.500</td>
            </tr>

            <tr>
                <td>Smartphone</td>
                <td>25</td>
                <td>R$ 1.990</td>
            </tr>

            <tr>
                <td>Fone Bluetooth</td>
                <td>50</td>
                <td>R$ 250</td>
            </tr>
        </table>
    </main>
</body>
</html>
