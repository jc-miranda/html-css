<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer namorar comigo? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            overflow: hidden;
            position: relative;
        }

        .fundo-coracoes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            max-width: 420px;
            width: 90%;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.5s ease;
        }

        .emoji-principal {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulsar 1.5s infinite;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 16px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        #btn-sim {
            background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
            color: white;
            transition: transform 0.2s;
        }

        #btn-sim:hover {
            transform: scale(1.15);
            box-shadow: 0 12px 20px rgba(255, 77, 109, 0.4);
        }

        #btn-nao {
            background-color: #f0f0f0;
            color: #666;
            position: absolute;
            /* Removemos a transição de movimento. Agora ele "teleporta" instantaneamente, 
               o que impede o clique acidental no celular! */
        }

        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="fundo-coracoes" id="coracoes"></div>

    <main class="card" id="conteudo-card">
        <div class="emoji-principal">💝</div>
        <h1>Quer namorar comigo?</h1>
        <p>Prometo te fazer a pessoa mais feliz desse mundo!</p>
        
        <div class="botoes">
            <button id="btn-sim" onclick="aceitou()">SIM!</button>
            <button id="btn-nao" onmouseover="foge()" ontouchstart="foge()" onclick="foge()">NÃO</button>
        </div>
    </main>

    <audio id="musica" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <script>
        // Posiciona o botão NÃO dinamicamente no início para alinhar com o SIM
        window.onload = function() {
            const btnSim = document.getElementById('btn-sim');
            const btnNao = document.getElementById('btn-nao');
            btnNao.style.left = (btnSim.offsetLeft + btnSim.offsetWidth + 20) + 'px';
            btnNao.style.top = btnSim.offsetTop + 'px';
        };

        function foge() {
            const btnNao = document.getElementById('btn-nao');
            
            document.getElementById('musica').play().catch(() => {});

            const larguraJanela = window.innerWidth;
            const alturaJanela = window.innerHeight;

            // Deixa uma margem extra nas bordas para o botão nunca sumir metade para fora da tela do celular
            const limiteX = larguraJanela - btnNao.offsetWidth - 20;
            const limiteY = alturaJanela - btnNao.offsetHeight - 20;
            
            const novoX = Math.max(10, Math.floor(Math.random() * limiteX));
            const novoY = Math.max(10, Math.floor(Math.random() * limiteY));
            
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        function aceitou() {
            const card = document.getElementById('conteudo-card');
            card.style.transform = "scale(0)";
            
            setTimeout(() => {
                card.innerHTML = `
                    <div style="font-size: 5rem; animation: pulsar 1s infinite;">💖</div>
                    <h1 style="color: #ff4d6d; font-size: 2.2rem; margin-top: 15px;">EBAAA! 😍</h1>
                    <p style="font-size: 1.2rem; margin-top: 15px; color: #333; padding: 0 10px;">
                        Você acabou de fazer a melhor escolha da sua vida! <br><br>
                        <b>Te amo muito! ❤️</b>
                    </p>
                `;
                card.style.transform = "scale(1)";
                setInterval(criarCoracao, 150);
            }, 500);
        }

        function criarCoracao() {
            const fundo = document.getElementById('coracoes');
            const coracao = document.createElement('div');
            
            coracao.innerHTML = '❤️';
            coracao.style.position = 'absolute';
            coracao.style.left = Math.random() * 100 + 'vw';
            coracao.style.top = '100vh';
            coracao.style.fontSize = Math.random() * 20 + 10 + 'px';
            coracao.style.opacity = Math.random() * 0.7 + 0.3;
            coracao.style.transition = 'transform 4s linear, opacity 4s ease';
            
            fundo.appendChild(coracao);

            setTimeout(() => {
                coracao.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                coracao.style.opacity = '0';
            }, 100);

            setTimeout(() => {
                coracao.remove();
            }, 4000);
        }

        setInterval(criarCoracao, 1000);
    </script>
</body>
</html>
