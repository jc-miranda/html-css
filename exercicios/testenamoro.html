<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer namorar comigo? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            overflow: hidden;
            position: relative;
        }

        /* Corações flutuantes de fundo */
        .fundo-coracoes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Container Principal */
        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
        }

        .emoji-principal {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulsar 1.5s infinite;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.4rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        /* Área dos Botões */
        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            height: 60px;
            position: relative;
        }

        button {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        #btn-sim {
            background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
            color: white;
        }

        #btn-sim:hover {
            transform: scale(1.15);
            box-shadow: 0 12px 20px rgba(255, 77, 109, 0.4);
        }

        #btn-nao {
            background-color: #f0f0f0;
            color: #666;
            position: absolute;
        }

        /* Tela de Sucesso Escondida */
        .sucesso {
            display: none;
        }

        /* Animações */
        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Corações flutuantes gerados por JS vão aqui -->
    <div class="fundo-coracoes" id="coracoes"></div>

    <!-- CARD DO PEDIDO -->
    <main class="card" id="conteudo-card">
        <div class="emoji-principal">💝</div>
        <h1>Quer namorar comigo?</h1>
        <p>Prometo te fazer a pessoa mais feliz desse mundo!</p>
        
        <div class="botoes">
            <button id="btn-sim" onclick="aceitou()">SIM!</button>
            <button id="btn-nao" onmouseover="foge()" onclick="foge()">NÃO</button>
        </div>
    </main>

    <!-- Música de fundo (Opcional: troque o link se quiser outra) -->
    <audio id="musica" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <script>
        // Faz o botão NÃO fugir de forma inteligente
        function foge() {
            const btnNao = document.getElementById('btn-nao');
            
            // Tenta dar play na música na primeira tentativa de clique da pessoa (interação)
            document.getElementById('musica').play().catch(() => {});

            // Margem de segurança para o botão não sumir para fora da tela
            const padding = 100;
            const larguraTela = window.innerWidth - padding;
            const alturaTela = window.innerHeight - padding;
            
            // Força a posição a ser na tela inteira, ignorando o container
            const novoX = Math.random() * (larguraTela - 50) + 25;
            const novoY = Math.random() * (alturaTela - 50) + 25;
            
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        // Função executada ao clicar em SIM
        function aceitou() {
            const card = document.getElementById('conteudo-card');
            
            // Transforma o conteúdo do card atual em uma linda tela de sucesso
            card.style.transform = "scale(0)";
            
            setTimeout(() => {
                card.innerHTML = `
                    <div style="font-size: 5rem; animation: pulsar 1s infinite;">💖</div>
                    <h1 style="color: #ff4d6d; font-size: 2.5rem; margin-top: 15px;">EBAAA! 😍</h1>
                    <p style="font-size: 1.3rem; margin-top: 15px; color: #333;">
                        Você acabou de fazer a melhor escolha da sua vida! <br>
                        <b>Te amo muito! ❤️</b>
                    </p>
                `;
                card.style.transform = "scale(1)";
                
                // Chuva de confetes/corações contínua
                setInterval(criarCoracao, 150);
            }, 500);
        }

        // Gera corações fofos flutuando no fundo
        function criarCoracao() {
            const fundo = document.getElementById('coracoes');
            const coracao = document.createElement('div');
            
            coracao.innerHTML = '❤️';
            coracao.style.position = 'absolute';
            coracao.style.left = Math.random() * 100 + 'vw';
            coracao.style.top = '100vh';
            coracao.style.fontSize = Math.random() * 20 + 10 + 'px';
            coracao.style.opacity = Math.random() * 0.7 + 0.3;
            coracao.style.transition = 'transform 4s linear, opacity 4s ease';
            
            fundo.appendChild(coracao);

            // Anima o coração subindo
            setTimeout(() => {
                coracao.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                coracao.style.opacity = '0';
            }, 100);

            // Deleta o elemento depois que a animação acaba para não travar o PC
            setTimeout(() => {
                coracao.remove();
            }, 4000);
        }

        // Começa a soltar corações bem devagar no fundo logo ao abrir o site
        setInterval(criarCoracao, 1000);
    </script>
</body>
</html>
