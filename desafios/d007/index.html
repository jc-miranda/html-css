<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon.png" type="image/x-icon">
    <title>Imagens Dinâmicas</title>
</head>
<body>
    <h1>Imagens em HTML5</h1>
    <p>A imagem logo abaixo é dinâmica, você consegue testar isso redimensionando a tela.</p>
    <picture>
        <source media="(max-width: 650px)" srcset="imagens/paisagem-p.png" type="image/">
        <source media="(max-width: 1050px)" srcset="imagens/paisagem-m.png" type="image/png">
        <img src="imagens/paisagem-g.png" alt="paisagem">
    </picture>
</body>
</html>
